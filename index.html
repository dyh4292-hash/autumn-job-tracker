<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="秋招求职投递与流程推进看板" />
  <title>秋招进度站</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f4a261'/%3E%3Cpath d='M18 24h28v24H18zM25 24v-6h14v6' fill='none' stroke='%230b1324' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M18 32h28' stroke='%230b1324' stroke-width='5'/%3E%3C/svg%3E" />
  <style>
    :root{--bg:#f5f7fb;--panel:#ffffff;--panel2:#ffffff;--line:#e2e7f0;--text:#172033;--muted:#738096;--accent:#f0a04b;--accent2:#e76f51;--blue:#3978d4;--green:#2f9d72;--danger:#d65353;--shadow:0 16px 40px rgba(44,62,92,.14)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% -10%,#dfeaff 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1600px;margin:auto;padding:24px 28px 36px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);display:grid;place-items:center;color:#0b1324;font-weight:900;font-size:20px;box-shadow:0 8px 24px rgba(244,162,97,.22)}h1{font-size:20px;margin:0;letter-spacing:.02em}.season{color:var(--muted);font-size:13px;margin-top:1px}.header-actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:11px;display:inline-flex;align-items:center;gap:8px}.btn:hover{border-color:#41516c}.btn.primary{background:var(--accent);border-color:var(--accent);color:#101827;font-weight:750}.btn.primary:hover{background:#ffb071}.btn.ghost{background:transparent}
    .overview{display:grid;grid-template-columns:repeat(4,1fr) 1.8fr;gap:12px;margin-bottom:18px}.stat,.next-card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:16px;padding:15px 17px;min-height:92px;box-shadow:0 5px 18px rgba(46,68,101,.05)}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:27px;font-weight:780;margin-top:8px;letter-spacing:-.04em}.stat-value small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}.next-card{display:flex;align-items:center;justify-content:space-between;gap:16px;border-color:#f0d8bd;background:linear-gradient(135deg,#fff8ef,#fff)}.next-eyebrow{color:#b76622;font-size:12px;font-weight:700;letter-spacing:.12em}.next-title{font-size:16px;font-weight:750;margin-top:5px}.next-time{color:#a66a32;margin-top:2px;font-size:13px}.day-badge{flex:none;width:56px;height:56px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:850;font-size:23px}.day-badge span{display:block;font-size:9px;letter-spacing:.08em;margin-top:-6px}
    .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}.search{position:relative;flex:1;max-width:420px}.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px 14px 11px 39px;border-radius:12px;outline:none}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(110,168,254,.12)}.search:before{content:'⌕';position:absolute;left:14px;top:7px;font-size:22px;color:var(--muted)}select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 35px 10px 13px;border-radius:12px;outline:none}.toolbar-note{margin-left:auto;color:var(--muted);font-size:13px}
    .board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}.column{background:#edf1f7;border:1px solid var(--line);border-radius:17px;min-height:455px;padding:12px}.column-head{display:flex;align-items:center;gap:9px;padding:3px 3px 13px;font-weight:720}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.count{margin-left:auto;border:1px solid #d5dce8;color:var(--muted);background:#fff;font-size:12px;min-width:23px;height:23px;border-radius:20px;display:grid;place-items:center}.cards{display:grid;gap:9px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;transition:.18s transform,.18s border-color;box-shadow:0 5px 15px rgba(42,61,90,.07);cursor:pointer}.card:hover{transform:translateY(-2px);border-color:#b8c4d6}.card:focus-visible{outline:3px solid rgba(57,120,212,.22);border-color:var(--blue)}.card-top{display:flex;align-items:flex-start;gap:10px}.company-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800;color:#172033}.company{font-weight:740}.role{color:var(--muted);font-size:13px;margin-top:1px}.tag{margin-left:auto;font-size:11px;border:1px solid #d8deea;background:#f8f9fc;padding:2px 6px;border-radius:6px;color:#68758a;white-space:nowrap}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:13px 0 10px}.nature{color:#5d6d86}.deadline{color:#a86023}.card-bottom{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:10px}.date{font-size:12px;color:#8792a5}.stage-actions{margin-left:auto;display:flex;gap:4px}.advance,.back{border:0;background:transparent;font-size:12px;padding:3px}.advance{color:var(--blue)}.advance:hover{color:#1d58ac}.back{color:#6f7d91}.back:hover{color:#39475d}.delete{border:0;background:transparent;color:#a2abba;font-size:16px;line-height:1;padding:3px 0 3px 8px}.delete:hover{color:var(--danger)}.empty{color:#8a96aa;text-align:center;border:1px dashed #ccd4e1;border-radius:12px;padding:24px 8px;font-size:13px;background:rgba(255,255,255,.3)}
    dialog{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:18px;padding:0;width:min(500px,calc(100vw - 28px));box-shadow:var(--shadow)}dialog::backdrop{background:rgba(23,32,51,.38);backdrop-filter:blur(5px)}.modal-head{padding:20px 22px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.modal-head h2{font-size:18px;margin:0}.close{background:none;border:0;color:var(--muted);font-size:24px}.form{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{color:#566379;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:10px;padding:10px 12px;outline:none}.field textarea{resize:vertical;min-height:70px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}.modal-foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:5px}
    .toast{position:fixed;right:24px;bottom:24px;background:#e9f7f1;color:#123e2d;padding:12px 17px;border-radius:11px;font-weight:650;box-shadow:var(--shadow);transform:translateY(90px);opacity:0;transition:.25s}.toast.show{transform:none;opacity:1}.user-pill{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px;padding:10px 2px}.app[hidden]{display:none}.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 65% 10%,#dfeaff 0,transparent 34%),var(--bg)}.auth-shell[hidden]{display:none}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.auth-card h2{margin:0 0 7px;font-size:25px}.auth-copy{margin:0 0 22px;color:var(--muted)}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f4f8;border-radius:11px;padding:4px;margin-bottom:20px}.auth-tab{border:0;background:transparent;padding:9px;border-radius:8px;color:var(--muted)}.auth-tab.active{background:#fff;color:var(--text);font-weight:700;box-shadow:0 2px 8px rgba(38,54,78,.08)}.auth-form{display:grid;gap:14px}.auth-form input{width:100%;border:1px solid var(--line);background:#f8fafc;color:var(--text);border-radius:11px;padding:12px 13px;outline:none}.auth-form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(57,120,212,.1)}.auth-message{min-height:22px;color:var(--danger);font-size:13px}.auth-message.success{color:var(--green)}.syncing{opacity:.72;transition:opacity .2s}
    @media(max-width:1100px){.overview{grid-template-columns:repeat(4,1fr)}.next-card{grid-column:1/-1}.board{grid-template-columns:repeat(5,270px)}}
    @media(max-width:680px){.app{padding:18px 14px}.brand .season{display:none}.header-actions .btn.ghost{display:none}.overview{grid-template-columns:1fr 1fr}.next-card{grid-column:1/-1}.stat{min-height:82px}.stat-value{font-size:24px}.toolbar{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}.toolbar-note{display:none}.board{margin-right:-14px}.form{grid-template-columns:1fr}.field.full,.modal-foot{grid-column:1}}
  </style>
</head>
<body>
  <section class="auth-shell" id="authShell">
    <div class="auth-card">
      <div class="auth-brand"><div class="logo">秋</div><div><h1>秋招进度站</h1><div class="season">你的求职进度，安全同步</div></div></div>
      <h2 id="authTitle">欢迎回来</h2><p class="auth-copy" id="authCopy">登录后查看你的投递进度</p>
      <div class="auth-tabs"><button class="auth-tab active" data-mode="login">登录</button><button class="auth-tab" data-mode="signup">注册</button></div>
      <form class="auth-form" id="authForm"><input name="email" type="email" autocomplete="email" required placeholder="邮箱地址" aria-label="邮箱地址"><input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="密码（至少 8 位）" aria-label="密码"><div class="auth-message" id="authMessage"></div><button class="btn primary" id="authSubmit" type="submit">登录</button></form>
    </div>
  </section>
  <main class="app" id="app" hidden>
    <header>
      <div class="brand"><div class="logo">秋</div><div><h1>秋招进度站</h1><div class="season">2027 届 · 把每一步都稳稳推进</div></div></div>
      <div class="header-actions"><span class="user-pill" id="userEmail"></span><button class="btn ghost" id="logoutBtn">退出</button><button class="btn ghost" id="resetBtn">清空记录</button><button class="btn primary" id="addBtn"><span>＋</span> 新增投递</button></div>
    </header>
    <section class="overview" aria-label="投递概览">
      <div class="stat"><div class="stat-label">累计投递</div><div class="stat-value" id="totalStat">0</div></div>
      <div class="stat"><div class="stat-label">进行中</div><div class="stat-value" id="activeStat">0 <small>家公司</small></div></div>
      <div class="stat"><div class="stat-label">面试转化</div><div class="stat-value" id="rateStat">0%</div></div>
      <div class="stat"><div class="stat-label">已收获 Offer</div><div class="stat-value" id="offerStat">0</div></div>
      <div class="next-card"><div><div class="next-eyebrow">最近安排</div><div class="next-title" id="nextTitle">暂无待办面试</div><div class="next-time" id="nextTime">添加面试日期后会显示在这里</div></div><div class="day-badge" id="dayBadge">—<span>DAY</span></div></div>
    </section>
    <div class="toolbar">
      <div class="search"><input id="searchInput" type="search" placeholder="搜索公司或岗位" aria-label="搜索公司或岗位" /></div>
      <select id="typeFilter" aria-label="筛选岗位类型"><option value="all">全部岗位</option><option>技术</option><option>产品</option><option>设计</option><option>运营</option><option>市场</option><option>销售</option><option>人力资源</option><option>财务</option><option>法务</option><option>行政</option><option>咨询</option><option>管培生</option><option>供应链</option><option>其他</option></select>
      <select id="sortSelect" aria-label="排序方式"><option value="new">最近更新</option><option value="deadline">截止日期</option></select>
      <div class="toolbar-note">已安全同步至云端</div>
    </div>
    <section class="board" id="board" aria-label="招聘流程看板"></section>
  </main>
  <dialog id="addDialog">
    <div class="modal-head"><h2 id="modalTitle">记录一笔新投递</h2><button class="close" id="closeBtn" aria-label="关闭">×</button></div>
    <form class="form" id="jobForm">
      <input type="hidden" id="editId" name="editId" />
      <div class="field"><label for="company">公司名称</label><input id="company" name="company" required placeholder="如：字节跳动" /></div>
      <div class="field"><label for="role">岗位名称</label><input id="role" name="role" required placeholder="如：前端开发工程师" /></div>
      <div class="field"><label for="type">岗位类型</label><select id="type" name="type"><option>技术</option><option>产品</option><option>设计</option><option>运营</option><option>市场</option><option>销售</option><option>人力资源</option><option>财务</option><option>法务</option><option>行政</option><option>咨询</option><option>管培生</option><option>供应链</option><option>其他</option></select></div>
      <div class="field"><label for="status">当前阶段</label><select id="status" name="status"><option value="applied">已投递</option><option value="written">笔试 / 测评</option><option value="interview">面试中</option><option value="offer">Offer</option><option value="ended">已结束</option></select></div>
      <div class="field"><label for="enterpriseNature">企业性质</label><select id="enterpriseNature" name="enterpriseNature"><option>央国企</option><option>民企</option><option>外企</option><option>其他</option></select></div>
      <div class="field"><label for="deadline">投递截止</label><input id="deadline" name="deadline" type="date" /></div>
      <div class="field"><label for="eventDate">下一场面试 / 测评</label><input id="eventDate" name="eventDate" type="date" /></div>
      <div class="field full"><label for="note">备注</label><textarea id="note" name="note" placeholder="内推人、面试准备重点、岗位链接……"></textarea></div>
      <div class="modal-foot"><button type="button" class="btn ghost" id="cancelBtn">取消</button><button class="btn primary" id="saveBtn" type="submit">保存投递</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status">已保存</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
    const stages=[['applied','已投递','#8f9bb0'],['written','笔试 / 测评','#b491f0'],['interview','面试中','#6ea8fe'],['offer','Offer','#5bc89b'],['ended','已结束','#637085']];
    const db=window.supabase.createClient('https://hptzgchlcestusotthft.supabase.co','sb_publishable_tIK6gTlou-MFXicAVyQN4A_HapOzkF4');
    let jobs=[],session=null,authMode='login',busyCount=0;
    const el=id=>document.getElementById(id), fmt=d=>d?new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('zh-CN',{month:'short',day:'numeric'}):'未设置';
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function setBusy(on){busyCount=Math.max(0,busyCount+(on?1:-1));el('app').classList.toggle('syncing',busyCount>0);el('app').setAttribute('aria-busy',String(busyCount>0))}
    async function runBusy(task,errorText){setBusy(true);try{const result=await task();if(result?.error){console.error(result.error);showToast(errorText);return null}return result}catch(error){console.error(error);showToast(errorText);return null}finally{setBusy(false)}}
    async function loadJobs(){const result=await runBusy(()=>db.from('job_applications').select('*').order('updated_at',{ascending:false}),'同步失败，请稍后重试');if(!result)return;jobs=(result.data||[]).map(j=>({...j,type:j.job_type,enterpriseNature:j.enterprise_nature||'其他',eventDate:j.event_date,updated:j.updated_at}));render()}
    function initials(name){return name.slice(0,2)}
    function color(name){const colors=['#f4a261','#78c6b2','#8faef5','#e58f9e','#c49bee','#e4ca76'];let n=[...name].reduce((a,c)=>a+c.charCodeAt(0),0);return colors[n%colors.length]}
    function render(){
      const q=el('searchInput').value.trim().toLowerCase(), type=el('typeFilter').value, sort=el('sortSelect').value;
      let visible=jobs.filter(j=>(j.company+j.role).toLowerCase().includes(q)&&(type==='all'||j.type===type));
      visible.sort((a,b)=>sort==='deadline'?(a.deadline||'9999').localeCompare(b.deadline||'9999'):(b.updated||'').localeCompare(a.updated||''));
      el('board').innerHTML=stages.map(([key,label,c])=>{const list=visible.filter(j=>j.status===key);return `<article class="column"><div class="column-head"><i class="dot" style="background:${c}"></i>${label}<span class="count">${list.length}</span></div><div class="cards">${list.length?list.map(card).join(''):'<div class="empty">暂无记录</div>'}</div></article>`}).join('');
      el('totalStat').textContent=jobs.length;el('activeStat').innerHTML=`${jobs.filter(j=>!['offer','ended'].includes(j.status)).length} <small>家公司</small>`;
      const interviews=jobs.filter(j=>j.status==='interview').length;el('rateStat').textContent=(jobs.length?Math.round(interviews/jobs.length*100):0)+'%';el('offerStat').textContent=jobs.filter(j=>j.status==='offer').length;
      const upcoming=jobs.filter(j=>j.eventDate&&new Date(j.eventDate+'T23:59:59')>=new Date()).sort((a,b)=>a.eventDate.localeCompare(b.eventDate))[0];
      if(upcoming){const days=Math.ceil((new Date(upcoming.eventDate+'T23:59:59')-new Date())/86400000);el('nextTitle').textContent=`${upcoming.company} · ${upcoming.role}`;el('nextTime').textContent=`${fmt(upcoming.eventDate)} · ${upcoming.status==='written'?'在线测评':'流程安排'}`;el('dayBadge').innerHTML=`${Math.max(0,days)}<span>DAY</span>`}else{el('nextTitle').textContent='暂无待办面试';el('nextTime').textContent='添加面试日期后会显示在这里';el('dayBadge').innerHTML='—<span>DAY</span>'}
    }
    function card(j){const idx=stages.findIndex(s=>s[0]===j.status),prev=idx>0?stages[idx-1][1]:'',next=idx<stages.length-1?stages[idx+1][1]:'';return `<div class="card" data-id="${j.id}" tabindex="0" role="button" aria-label="编辑 ${esc(j.company)} ${esc(j.role)}"><div class="card-top"><div class="company-icon" style="background:${color(j.company)}">${esc(initials(j.company))}</div><div><div class="company">${esc(j.company)}</div><div class="role">${esc(j.role)}</div></div><span class="tag">${esc(j.type)}</span></div><div class="meta"><span class="nature">${esc(j.enterpriseNature)}</span><span>截止 ${fmt(j.deadline)}</span>${j.eventDate?`<span class="deadline">安排 ${fmt(j.eventDate)}</span>`:''}</div><div class="card-bottom"><span class="date">更新于 ${fmt(j.updated)}</span><span class="stage-actions">${prev?`<button class="back" data-id="${j.id}">← ${prev}</button>`:''}${next?`<button class="advance" data-id="${j.id}">${next} →</button>`:''}</span><button class="delete" data-id="${j.id}" aria-label="删除 ${esc(j.company)} ${esc(j.role)}" title="删除">×</button></div></div>`}
    async function moveStage(j,delta){const idx=stages.findIndex(s=>s[0]===j.status),target=stages[idx+delta];if(!target)return;const result=await runBusy(()=>db.from('job_applications').update({status:target[0],updated_at:new Date().toISOString()}).eq('id',j.id),'调整进度失败');if(!result)return;await loadJobs();showToast(`已调整至「${target[1]}」`)}
    el('board').addEventListener('click',async e=>{const del=e.target.closest('.delete');if(del){const j=jobs.find(x=>x.id==del.dataset.id);if(j&&confirm(`确定删除「${j.company} · ${j.role}」吗？`)){const result=await runBusy(()=>db.from('job_applications').delete().eq('id',j.id),'删除失败');if(!result)return;await loadJobs();showToast('记录已删除')}return}const action=e.target.closest('.advance,.back');if(action){const j=jobs.find(x=>x.id==action.dataset.id);if(j)await moveStage(j,action.classList.contains('advance')?1:-1);return}const cardEl=e.target.closest('.card');if(cardEl)openJobDialog(jobs.find(x=>x.id==cardEl.dataset.id))});
    el('board').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();openJobDialog(jobs.find(x=>x.id==e.target.dataset.id))}});
    ['searchInput','typeFilter','sortSelect'].forEach(id=>el(id).addEventListener('input',render));
    const dlg=el('addDialog');
    function openJobDialog(job=null){const form=el('jobForm');form.reset();el('editId').value=job?.id||'';el('modalTitle').textContent=job?'修改求职信息':'记录一笔新投递';el('saveBtn').textContent=job?'保存修改':'保存投递';if(job){form.company.value=job.company;form.role.value=job.role;form.type.value=job.type;form.status.value=job.status;form.enterpriseNature.value=job.enterpriseNature||'其他';form.deadline.value=job.deadline||'';form.eventDate.value=job.eventDate||'';form.note.value=job.note||''}dlg.showModal()}
    el('addBtn').onclick=()=>openJobDialog();el('closeBtn').onclick=el('cancelBtn').onclick=()=>dlg.close();
    el('jobForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),editId=f.get('editId'),payload={company:f.get('company'),role:f.get('role'),job_type:f.get('type'),enterprise_nature:f.get('enterpriseNature'),status:f.get('status'),deadline:f.get('deadline')||null,event_date:f.get('eventDate')||null,note:f.get('note')||'',updated_at:new Date().toISOString()};const result=await runBusy(()=>editId?db.from('job_applications').update(payload).eq('id',editId):db.from('job_applications').insert(payload),editId?'修改失败，请重试':'保存失败，请重试');if(!result)return;await loadJobs();dlg.close();e.target.reset();showToast(editId?'修改已保存':'新投递已同步')};
    el('resetBtn').onclick=async()=>{if(!jobs.length)return showToast('当前没有记录');if(confirm('确定清空全部投递记录吗？此操作无法撤销。')){const result=await runBusy(()=>db.from('job_applications').delete().eq('user_id',session.user.id),'清空失败');if(!result)return;await loadJobs();showToast('已清空全部记录')}};
    el('logoutBtn').onclick=()=>db.auth.signOut();
    function showToast(t){el('toast').textContent=t;el('toast').classList.add('show');setTimeout(()=>el('toast').classList.remove('show'),1800)}
    function registerAgentTools(){
      const ctx=document.modelContext;if(!ctx?.registerTool)return;
      const validStages=stages.map(s=>s[0]);
      ctx.registerTool({name:'list_job_applications',title:'查看投递记录',description:'读取当前秋招看板里的投递记录，可按招聘阶段筛选。',inputSchema:{type:'object',properties:{status:{type:'string',enum:validStages}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input={}){return {count:jobs.filter(j=>!input.status||j.status===input.status).length,applications:jobs.filter(j=>!input.status||j.status===input.status).map(({company,role,type,status,deadline,eventDate})=>({company,role,type,status,deadline,eventDate}))}}});
      ctx.registerTool({name:'create_job_application',title:'新增投递',description:'在当前登录账号的秋招看板中新建一条投递记录。',inputSchema:{type:'object',properties:{company:{type:'string',minLength:1},role:{type:'string',minLength:1},type:{type:'string',enum:['技术','产品','设计','运营','市场','销售','人力资源','财务','法务','行政','咨询','管培生','供应链','其他']},enterpriseNature:{type:'string',enum:['央国企','民企','外企','其他']},status:{type:'string',enum:validStages},deadline:{type:'string'},eventDate:{type:'string'},note:{type:'string'}},required:['company','role','type'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},async execute(input){if(!session)throw new Error('请先登录');const {data,error}=await db.from('job_applications').insert({company:input.company.trim(),role:input.role.trim(),job_type:input.type,enterprise_nature:input.enterpriseNature||'其他',status:input.status||'applied',deadline:input.deadline||null,event_date:input.eventDate||null,note:input.note||''}).select().single();if(error)throw error;await loadJobs();return {created:true,id:data.id,company:data.company,role:data.role,status:data.status}}});
    }
    document.querySelectorAll('.auth-tab').forEach(tab=>tab.onclick=()=>{authMode=tab.dataset.mode;document.querySelectorAll('.auth-tab').forEach(t=>t.classList.toggle('active',t===tab));el('authTitle').textContent=authMode==='login'?'欢迎回来':'创建账号';el('authCopy').textContent=authMode==='login'?'登录后查看你的投递进度':'注册后即可在不同设备同步';el('authSubmit').textContent=authMode==='login'?'登录':'注册';el('authMessage').textContent=''});
    el('authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=f.get('email'),password=f.get('password');el('authSubmit').disabled=true;el('authMessage').textContent='';el('authMessage').className='auth-message';try{const {data,error}=authMode==='login'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password});if(error){el('authMessage').textContent=error.message==='Invalid login credentials'?'邮箱或密码不正确':error.message;return}if(authMode==='signup'&&!data.session){el('authMessage').className='auth-message success';el('authMessage').textContent='注册成功，请查收验证邮件后登录'}}catch(error){console.error(error);el('authMessage').textContent='网络异常，请稍后重试'}finally{el('authSubmit').disabled=false}}
    db.auth.onAuthStateChange((_event,newSession)=>{session=newSession;el('authShell').hidden=!!session;el('app').hidden=!session;if(session){el('userEmail').textContent=session.user.email;setTimeout(()=>loadJobs(),0)}else{jobs=[];render()}});
    registerAgentTools();
    db.auth.getSession().then(({data})=>{if(!data.session){el('authShell').hidden=false;el('app').hidden=true}});
  </script>
</body>
</html>
